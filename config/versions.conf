# Matriz de versões verificada em 2026-10-07 contra fontes oficiais:
#   - Release notes oficiais:  https://docs.docker.com/engine/release-notes/29/
#     (Docker Engine 29.8.2: BuildKit v0.33.1, containerd v2.3.6,
#      runc v1.5.2, Go 1.26.8)
#   - Repositório oficial de pacotes: https://download.docker.com/linux/ubuntu/
#     (containerd.io_2.3.6-1, docker-buildx-plugin_0.37.x)
#   - go.mod / vendor.mod de cada projeto (requisito mínimo de Go)
#   - Tags e SHAs de commit verificados via git ls-remote
# ===========================================================================

# --- Versões (somente atualizar após conferência nas fontes oficiais) ---
