CLI_VERSION=29.8.2           # Docker CLI
CONTAINERD_VERSION=2.3.6     # containerd
RUNC_VERSION=1.5.2           # runc
BUILDKIT_VERSION=0.33.1      # BuildKit
BUILDX_VERSION=0.37.2        # Buildx (plugin CLI, pacote das .deb/.rpm oficiais)
TINI_VERSION=v0.19.0         # docker-init (pinned pelo Moby em hack/dockerfile/install/tini.installer)

# --- Toolchain Go (oficial, sha256 do JSON oficial go.dev/dl) ---
